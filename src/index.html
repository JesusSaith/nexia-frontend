<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Nexia</title>
    <meta name="description" content="Nexia: página de reservas en línea y panel para salones, barberías, spas, consultorios, clínicas, veterinarias y estudios que atienden con cita." />
    <base href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexia" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:title" content="Nexia · Reservas en línea para negocios con cita" />
    <meta property="og:description" content="Tus clientes reservan solos, a cualquier hora. Agenda, equipo, clientes y cobros desde el celular." />
    <meta property="og:image" content="https://nexiacitas.com/og-nexia.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f6f5f3" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nexia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo. El oscuro solo vive en el panel;
      // el resto (reservas públicas, login…) queda en claro. Misma lógica que admin-layout.ts.
      (function () {
        var path = location.pathname;
        var panel = path.indexOf('/admin') === 0 || path.indexOf('/super-admin') === 0;
        var pref = 'system';
        try {
          var saved = localStorage.getItem('nexia-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') pref = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = panel ? pref : 'light';
        // Color del negocio de la última visita: evita el parpadeo del color por defecto al recargar el panel.
        if (panel) {
          try {
            var brand = JSON.parse(localStorage.getItem('nexia-brand') || 'null');
            var hex = /^#[0-9a-f]{6}$/i;
            if (brand && hex.test(brand.primary)) {
              var root = document.documentElement.style;
              root.setProperty('--business-primary', brand.primary);
              root.setProperty('--primary', brand.primary);
              root.setProperty('--mat-sys-primary', brand.primary);
              if (brand.canvas && hex.test(brand.canvas)) root.setProperty('--bg-app', brand.canvas);
            }
          } catch (e) {}
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
