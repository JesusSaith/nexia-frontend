<main class="flex min-h-dvh items-center justify-center p-4">
  <mat-card class="w-full max-w-[420px]">
    <mat-card-content>
      <div class="mb-6 flex items-center gap-2">
        <mat-icon>event_available</mat-icon>
        <h1 class="text-xl font-medium">Nexia</h1>
      </div>
      <p class="mb-4 text-sm text-slate-600">Inicia sesión para entrar al panel.</p>

      <form class="flex flex-col gap-3" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
          <mat-label>Correo</mat-label>
          <mat-icon matPrefix>mail</mat-icon>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (emailError()) {
            <mat-error>{{ emailError() }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
          <mat-label>Contraseña</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            [attr.aria-label]="hidePassword() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          >
            <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          @if (passwordError()) {
            <mat-error>{{ passwordError() }}</mat-error>
          }
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p role="alert" class="text-sm text-red-700">{{ message }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/auth/register">Crear cuenta</a>
    </mat-card-actions>
  </mat-card>
</main>
