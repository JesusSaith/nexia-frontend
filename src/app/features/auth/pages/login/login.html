<main class="grid min-h-dvh bg-white lg:grid-cols-2">
  <section
    class="hidden items-center justify-center px-10 lg:flex"
    style="background: linear-gradient(100deg, color-mix(in srgb, var(--primary) 14%, white) 0%, color-mix(in srgb, var(--primary) 6%, white) 62%, white 100%)"
  >
    <img src="/nexia-mark.png" alt="Nexia" class="w-full max-w-md" />
  </section>

  <section class="flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm">
      <img src="/nexia-mark.png" alt="" class="mx-auto mb-2 w-40 lg:hidden" />
      <h1 class="text-xl font-semibold">Inicia sesión</h1>
      <p class="mb-6 mt-1 text-sm text-slate-500">Entra al panel de tu negocio.</p>

      <form class="flex flex-col gap-3" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
          <mat-label>Correo</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (emailError()) {
            <mat-error>{{ emailError() }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            [attr.aria-label]="hidePassword() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          >
            <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          @if (passwordError()) {
            <mat-error>{{ passwordError() }}</mat-error>
          }
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p role="alert" class="text-sm text-red-700">{{ message }}</p>
        }

        <button mat-flat-button color="primary" class="!h-11" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>

      <a
        mat-stroked-button
        class="mt-4 !h-11 w-full"
        routerLink="/auth/register"
      >
        Crear cuenta
      </a>
    </div>
  </section>
</main>
