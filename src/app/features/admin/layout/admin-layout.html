<mat-sidenav-container class="h-dvh">
  <mat-sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (closedStart)="closeSidebar()"
    class="w-64 border-r bg-white"
  >
    <div class="flex h-16 items-center gap-3 px-5">
      <span class="brand-soft flex h-9 w-9 items-center justify-center rounded-xl">
        <mat-icon>event_available</mat-icon>
      </span>
      <span class="text-base font-semibold tracking-tight">Nexia</span>
    </div>
    <mat-nav-list>
      @for (link of links(); track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive
          #section="routerLinkActive"
          [activated]="section.isActive"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="h-16 border-b bg-white px-4 md:px-8">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Abrir menú" (click)="toggleSidebar()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="truncate">{{ businessName() }}</span>
      <span class="flex-1"></span>
      <button mat-button type="button" [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        <span class="ml-1 hidden sm:inline">{{ currentUser()?.fullName }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item type="button" disabled>
          <mat-icon>badge</mat-icon>
          <span>{{ roleLabel() }}</span>
        </button>
        <button mat-menu-item type="button" (click)="logout()" [disabled]="loggingOut()">
          <mat-icon>logout</mat-icon>
          <span>{{ loggingOut() ? 'Cerrando…' : 'Cerrar sesión' }}</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    @if (logoutError(); as message) {
      <p role="alert" class="bg-red-50 px-4 py-2 text-sm text-red-700">{{ message }}</p>
    }

    <main class="mx-auto w-full max-w-6xl px-5 py-7 md:px-10 md:py-9">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
