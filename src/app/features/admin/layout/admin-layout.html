<div class="min-h-dvh bg-slate-50" (keydown.escape)="closeMenu()">
  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-slate-950/40 md:hidden"
      aria-label="Cerrar menú"
      (click)="closeSidebar()"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-72 flex-col border-r border-slate-200 bg-white transition-transform md:translate-x-0"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="flex h-16 items-center px-6">
      <a routerLink="/admin" class="text-lg font-semibold tracking-tight text-slate-950">Nexia</a>
    </div>

    <nav class="flex flex-1 flex-col gap-1 px-3 py-2" aria-label="Secciones del negocio">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-primary-50 text-primary-700"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950"
          (click)="closeSidebar()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="md:pl-72">
    <header
      class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-slate-200 bg-white/90 px-4 backdrop-blur md:px-8"
    >
      <div class="flex min-w-0 items-center gap-3">
        <button
          type="button"
          class="inline-flex size-10 items-center justify-center rounded-xl text-slate-700 hover:bg-slate-100 md:hidden"
          [attr.aria-expanded]="sidebarOpen()"
          [attr.aria-label]="sidebarOpen() ? 'Cerrar menú' : 'Abrir menú'"
          (click)="toggleSidebar()"
        >
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <p class="truncate text-sm font-semibold text-slate-950">{{ businessName() }}</p>
      </div>

      <div class="relative">
        <button
          type="button"
          class="flex items-center gap-3 rounded-full py-1 pr-2 pl-1 hover:bg-slate-100"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          (click)="toggleMenu()"
        >
          <span
            class="inline-flex size-9 items-center justify-center rounded-full bg-primary-600 text-xs font-semibold text-white"
          >
            {{ initials() }}
          </span>
          <span class="hidden text-left sm:block">
            <span class="block text-sm font-medium text-slate-900">
              {{ currentUser()?.fullName }}
            </span>
            <span class="block text-xs text-slate-500">{{ roleLabel() }}</span>
          </span>
        </button>

        @if (menuOpen()) {
          <button
            type="button"
            class="fixed inset-0 z-20 cursor-default"
            aria-label="Cerrar menú de usuario"
            (click)="closeMenu()"
          ></button>
          <div
            role="menu"
            class="absolute right-0 z-30 mt-2 w-60 rounded-2xl border border-slate-200 bg-white p-3 shadow-lg"
          >
            <p class="px-1 text-sm font-medium text-slate-900">{{ currentUser()?.fullName }}</p>
            <p class="mt-0.5 px-1 text-xs text-slate-500">{{ roleLabel() }}</p>
            @if (logoutError(); as message) {
              <p role="alert" class="mt-3 text-xs text-rose-600">{{ message }}</p>
            }
            <div class="mt-3">
              <app-custom-button variant="outline" [isLoading]="loggingOut()" (click)="logout()">
                Cerrar sesión
              </app-custom-button>
            </div>
          </div>
        }
      </div>
    </header>

    <main class="px-4 py-6 md:px-8 md:py-8">
      <router-outlet />
    </main>
  </div>
</div>
