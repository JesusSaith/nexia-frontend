<section class="mx-auto max-w-xl">
  <header class="mb-4 flex items-center gap-2">
    <mat-icon>account_circle</mat-icon>
    <h1 class="text-xl font-medium">Mi perfil</h1>
  </header>

  @if (loadError(); as message) {
    <p role="alert" class="text-sm text-red-700">{{ message }}</p>
  } @else if (isLoading()) {
    <div class="flex justify-center py-16">
      <mat-spinner diameter="36" />
    </div>
  } @else {
    <form class="flex flex-col gap-3" [formGroup]="form" (ngSubmit)="save()">
      <p class="text-sm text-slate-600">{{ profile()?.role_title }}</p>
      <label class="rounded-xl border border-[#e4dfda] bg-white px-3 py-2">
        <span class="block text-xs text-slate-500">Nombre</span>
        <input class="w-full bg-transparent text-sm outline-none" formControlName="full_name" />
      </label>
      @if (nameError()) {
        <p class="text-sm text-red-700">{{ nameError() }}</p>
      }
      <label class="rounded-xl border border-[#e4dfda] bg-white px-3 py-2">
        <span class="block text-xs text-slate-500">Teléfono</span>
        <input class="w-full bg-transparent text-sm outline-none" type="tel" formControlName="phone" />
      </label>
      <label class="rounded-xl border border-[#e4dfda] bg-white px-3 py-2">
        <span class="block text-xs text-slate-500">Foto</span>
        <input class="w-full bg-transparent text-sm outline-none" formControlName="avatar_url" placeholder="https://" />
      </label>
      <label class="rounded-xl border border-[#e4dfda] bg-white px-3 py-2">
        <span class="block text-xs text-slate-500">Biografía</span>
        <textarea class="w-full bg-transparent text-sm outline-none" rows="4" formControlName="bio"></textarea>
      </label>
      @if (formError(); as message) {
        <p role="alert" class="text-sm text-red-700">{{ message }}</p>
      }
      @if (saved()) {
        <p class="text-sm text-emerald-700">Perfil guardado.</p>
      }
      <button class="h-11 rounded-full bg-[#1E1B1E] text-sm font-medium text-white disabled:opacity-50" type="submit" [disabled]="isSaving()">
        {{ isSaving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </form>
  }
</section>
